# One-click deploy on Render.com: New → Blueprint → pick this repo.
# Free plan: sleeps after ~15 min idle, first request then takes ~50 s.
# Switch `plan` to `starter` ($7/mo) to keep it always awake.
services:
  - type: web
    name: nazel-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NAZEL_RATE_LIMIT_PER_MIN
        value: "30"
      - key: NAZEL_MAX_FILESIZE_MB
        value: "300"
      # In-app updater: bump these with every release.
      - key: NAZEL_APP_VERSION
        value: "1.3.0"
      - key: NAZEL_APP_BUILD
        value: "4"
      - key: NAZEL_APP_URL
        value: "https://github.com/zayedbaderfgfgdjhkhftd/nazel-download/releases/latest/download/Nazel.apk"
