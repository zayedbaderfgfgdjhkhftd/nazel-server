name: Test & build Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tesseract (OCR accuracy test) and qpdf (file checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr qpdf
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Build APK + AAB
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key (only if the repository secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.SATR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SATR_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key from secrets."
          else
            echo "No signing secrets: the APK/AAB are signed with a debug key (for testing only)."
          fi
      - run: flutter pub get
      - name: Build APK (one per CPU type) and AAB
        env:
          SATR_KEYSTORE_PASSWORD: ${{ secrets.SATR_KEYSTORE_PASSWORD }}
          SATR_KEY_ALIAS: ${{ secrets.SATR_KEY_ALIAS }}
          SATR_KEY_PASSWORD: ${{ secrets.SATR_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
      - name: Show what the APK asks for (no INTERNET permission expected)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: satr-pdf-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: satr-pdf-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
